server:
  port: 8080

spring:
  application:
    name: my-app
  profiles:
    # local 这个 profile 专门放不进版本库的私密配置（数据库密码等），
    # 文件是 application-local.yml，已在 .gitignore 里。首次拉代码后自己建一份。
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本机 MySQL 8.4.11，服务名 MySQL84，端口 3306，字符集 utf8mb4
    url: "jdbc:mysql://127.0.0.1:3306/my_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    # 密码不要写死在这里：用环境变量 DB_PASSWORD，或本地覆盖 application-dev.yml
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # ---------------- Flyway 数据库迁移 ----------------
  flyway:
    enabled: true
    # 迁移脚本位置（classpath 下），Flyway 按 V<版本>__<说明>.sql 命名排序执行
    locations: classpath:db/migration
    # 迁移前校验已应用脚本的 checksum：改过已发布的迁移就会启动失败。
    # 这是刻意的 —— 悄悄改历史迁移是多人协作里最容易造成环境不一致的做法。
    validate-on-migrate: true
    # 允许用 baseline 接管「已存在但还没有 flyway 历史表」的库。
    baseline-on-migrate: true
    # 关键：baseline 版本设为 2。
    #   - 空库：schema 为空，不会触发 baseline，V1/V2 正常执行 → 建出完整表结构；
    #   - 已有数据的库（本项目就是这种情况，表是手工建的）：
    #     Flyway 会在 V2 处打基线，跳过 V1/V2（它们的效果已存在），
    #     之后新增的 V3+ 正常执行。
    # 两个场景都成立，是「接手已有库 + 支持全新安装」的标准做法。
    # 注意：将来如果把基线往上调，已有环境的 V3 之后会被误判，改动前先想清楚。
    baseline-version: 2

  data:
    redis:
      # 本机 Redis 8.10.2，服务名 Redis，端口 6379
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      # 本机 Redis 未配置 requirepass，因此不设 password
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  # XML 映射文件位置（本骨架用注解为主，XML 仅作示例）
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.myapp.entity
  configuration:
    # 表字段 snake_case → 实体 camelCase
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打到控制台，上线请删掉这一行
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除字段（表结构见 Flyway 迁移脚本 db/migration/V1__init.sql）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.example.myapp: debug

app:
  jwt:
    # 签名密钥。刻意不写默认值（${APP_JWT_SECRET:}），于是未配置时该属性为空串，
    # 由 JwtProperties 判断并回落到内置开发密钥，同时打 WARN 提醒。
    # 生产环境必须通过环境变量 APP_JWT_SECRET 或 -Dapp.jwt.secret=... 提供，
    # 长度至少 32 字符（HS256 要求 256 位），可用 openssl rand -base64 48 生成。
    secret: ${APP_JWT_SECRET:}
    # ---- 双令牌有效期 ----
    # access：随每个业务请求发送，所以必须短。15 分钟意味着即便泄露，窗口也很小；
    # 用户不会因此频繁登录，因为前端会用 refresh 自动续期。
    # 注意：改密码/改角色会把 token_version +1，让**所有**已签发的令牌立即失效，
    # 所以"短有效期"是纵深防御，不是撤销的唯一手段。
    access-minutes: 15
    # refresh：只在换 access 时提交，不出现在业务请求里。
    # 7 天是为了免去频繁输密码；它同样受 token_version 约束，改密后一起作废。
    refresh-minutes: 10080
    # 设为 true 时，未提供外部密钥将直接启动失败。生产环境务必设为 true，
    # 否则忘记配密钥时会悄悄用公开的开发密钥签发令牌，任何人都能伪造。
    require-external-secret: false
  security:
    login:
      # 连续登录失败达到这个次数后，该用户名被临时锁定。
      # 调小更安全但更容易误伤（用户手滑几次就进不去）；5 次是常见折中。
      max-attempts: 5
      # 锁定时长（分钟），每次失败都会刷新，即「从最后一次失败算起」。
      # 从 15 分钟缩短到 3 分钟，是权衡后的结果：
      # 按用户名锁定意味着攻击者可以故意输错把别人锁在门外（DoS），
      # 锁得越久、别人被锁死的代价越大。3 分钟足以让自动化爆破的成本变得不可接受
      # （每 3 分钟只能试 5 次），同时把误伤控制在「喝口水就过去了」的量级。
      # 彻底解决需要 IP+用户名双维度计数或验证码，属独立需求。
      lock-minutes: 3
